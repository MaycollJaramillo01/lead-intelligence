[project]
name = "research-engine"
dynamic = ["version"]
description = "Lead Intelligence research worker: a sidecar process driven by the desktop core over JSON Lines."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.9",
]

[project.scripts]
research-engine = "research_engine.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/research_engine/__init__.py"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "local_services: talks to real local services (Ollama, NVIDIA driver); skipped with an explicit reason when absent",
]
